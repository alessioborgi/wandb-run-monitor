name: Test dashboard aggregation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax
        run: python -m compileall -q core.py app.py check_thresholds.py tests
      - name: Test without W&B credentials
        run: python -m unittest discover -s tests -v
